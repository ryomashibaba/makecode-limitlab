<title id="title">G4-C7 A55: two architectural ideas compared, G0 study not 3D proof</title>
<desc id="desc">Hand-authored conceptual elevation diagrams, not Blender renders: A has low lateral public buildings and a mall-like failure risk; B has vertically interlocked inhabited neighborhoods and a central civic room. Neither is approved as art.</desc>
