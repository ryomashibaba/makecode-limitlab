<linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffc58c"/><stop offset="1" stop-color="#bd745e"/></linearGradient>
<pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#9be5db" stroke-width=".6" opacity=".12"/></pattern>
</defs>
