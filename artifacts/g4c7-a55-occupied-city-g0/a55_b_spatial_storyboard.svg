<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
<title id="title">A55 Interlocked Sky Neighborhoods architectural storyboard</title>
<desc id="desc">Manually authored drawing of one connected future civic building shown as a human-eye view, inhabited section and distant urban-scale silhouette. Concept only, no actual Blender mesh or traversable floor proof.</desc>
<defs>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#061626"/><stop offset="1" stop-color="#0d3650"/></linearGradient>
<linearGradient id="hall" x2="0" y2="1"><stop stop-color="#24475e"/><stop offset=".55" stop-color="#447b81"/><stop offset="1" stop-color="#bb9e81"/></linearGradient>
<linearGradient id="day" x2="0" y2="1"><stop stop-color="#dbfff3" stop-opacity=".85"/><stop offset="1" stop-color="#aff4e6" stop-opacity="0"/></linearGradient>
