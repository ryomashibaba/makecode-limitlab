name: G4C7 M37-P2 real two Blender GUI screenshot context NO CITY ART
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - tools/g4c7_m37p2_live_gui_context_capture.py
      - tools/g4c7_m37p2_local_gui_vision_review.py
      - tools/g4c7_m37p2_x11_window_probe.py
      - tools/g4c7_m37p2_x11_differential_diagnosis.py
      - tools/g4c7_m37p2_x11_native_region_crop.py
      - tools/g4c7_m37p2_x11_visual_context_bridge.py
      - tests/test_g4c7_m37p2_x11_visual_context_bridge.py
      - tests/test_g4c7_m37p2_x11_native_region_crop.py
      - tests/test_g4c7_m37p2_x11_differential_diagnosis.py
      - tests/test_g4c7_m37p2_x11_window_probe.py
      - tests/test_g4c7_m37p2_local_gui_vision_review.py
      - .github/workflows/g4c7-m37p2-genuine-live-gui-context-capture.yml
permissions:
  contents: read
concurrency:
  # Preserve a running native-GUI diagnosis even when later documentation or
  # source fixes are pushed. GitHub may replace an older PENDING run, but
  # cancelling the RUNNING frame capture discards the diagnostic evidence.
  group: g4c7-p2-genuine-live-context
  cancel-in-progress: false
jobs:
  capture-two-real-native-viewports:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    # Isolated, ephemeral Blender preferences. No change to .blend or user machines.
    env:
      XDG_CONFIG_HOME: /tmp/g4c7-p2-isolated-xdg-config
    steps:
      - uses: actions/checkout@v4
      - name: Reject geometry mutation scripts and source tampering at the first gate
        run: |
          set -euo pipefail
          python3 -m py_compile tools/g4c7_m37p2_live_gui_context_capture.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART/M37P2_DIRECT_AUTHOR_NATIVE_EDITOR_FIXED_REVIEW_V3_NOT_ART.blend')
          assert src.is_file()
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='536e451c763c4326421b13285abf1056a3a11d755028f8ff20b54b99b08a0249'
          code=Path('tools/g4c7_m37p2_live_gui_context_capture.py').read_text()
          for forbidden in ('bpy.ops.mesh.', 'bpy.data.meshes.new(', '.from_pydata(', 'bpy.ops.wm.save_as_mainfile(', 'bpy.ops.render.render(', 'urllib.request', 'requests.post('):
              assert forbidden not in code,forbidden
          print('P2_GUI_CONTEXT_READ_ONLY_SOURCE_GUARD_PASS')
          PY
      - name: Test genuine PNG pixel decoder and local vision safety BEFORE GUI download
        run: |
          set -euo pipefail
          python3 -m py_compile tools/g4c7_m37p2_local_gui_vision_review.py
          python3 -m unittest discover -s tests -p 'test_g4c7_m37p2_local_gui_vision_review.py' -v
          echo 'PASS_STDLIB_REAL_PNG_CRC_AND_BLACK_PIXEL_VETO_BEFORE_BLENDER'
      - name: Test X11 window identification and fail-closed diagnostic before Blender
        run: |
          set -euo pipefail
          python3 -m py_compile tools/g4c7_m37p2_x11_window_probe.py
          python3 -m unittest discover -s tests -p 'test_g4c7_m37p2_x11_window_probe.py' -v
          echo 'PASS_X11_DIAGNOSTIC_ONLY_NEVER_ART_GATE'
      - name: Offline test fail-closed X11 versus true Blender VIEW_3D differential triage
        run: |
          set -euo pipefail
          python3 -m py_compile tools/g4c7_m37p2_x11_differential_diagnosis.py
          python3 -m unittest discover -s tests -p 'test_g4c7_m37p2_x11_differential_diagnosis.py' -v
          echo 'PASS_DIFFERENTIAL_DIAGNOSTIC_NOT_ART_GATE'
      - name: Install actual X display and OpenGL software drivers
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libxkbcommon0 libxi6 libxrender1 libsm6 libxrandr2 libxxf86vm1 imagemagick python3-pil x11-utils scrot
      - name: Test X11 native-window-region conservative crop before Blender fetch
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile tools/g4c7_m37p2_x11_native_region_crop.py
          /usr/bin/python3 -m unittest discover -s tests -p 'test_g4c7_m37p2_x11_native_region_crop.py' -v
          echo 'PASS_X11_REGION_GEOMETRY_CROP_NOT_EDITOR_OR_ART'
      - name: Fetch real official Blender 4.5.15 GUI and verify official release SHA
        run: |
          set -euo pipefail
          mkdir -p /tmp/g4c7-p2-live-gui-bin
          cd /tmp/g4c7-p2-live-gui-bin
          curl -fsSL --retry 3 --max-time 240 -o blender-4.5.15.sha256 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256
          curl -fsSL --retry 3 --max-time 240 -o blender-4.5.15-linux-x64.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz
          grep -F 'blender-4.5.15-linux-x64.tar.xz' blender-4.5.15.sha256 | sha256sum -c -
          tar -xf blender-4.5.15-linux-x64.tar.xz
          test -x blender-4.5.15-linux-x64/blender
      - name: Seed isolated Blender preferences to avoid first-run Quick Setup obstructing the real VIEW_3D
        run: |
          set -euo pipefail
          # The prior real X11 root capture showed the Blender 4.5 "Quick Setup"
          # modal still open over BOTH live editors, while screenshot_area gave
          # a 1x1 black frame. Do not reuse the GitHub runner user preference.
          mkdir -p "$XDG_CONFIG_HOME"
          blender=/tmp/g4c7-p2-live-gui-bin/blender-4.5.15-linux-x64/blender
          timeout --signal=TERM --kill-after=5s 75s "$blender" -b -t 2             --python-exit-code 9 --python-expr             "import bpy; r=bpy.ops.wm.save_userpref(); print('P2_SAVE_USERPREF', sorted(r)); assert 'FINISHED' in r"
          config="$XDG_CONFIG_HOME/blender/4.5/config/userpref.blend"
          test -s "$config"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ["XDG_CONFIG_HOME"])/"blender"/"4.5"/"config"/"userpref.blend"
          assert p.is_file() and p.stat().st_size>100
          with p.open("rb") as f: assert f.read(7)==b"BLENDER"
          print("P2_ISOLATED_REAL_BLENDER_USERPREF_READY",
                p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Attempt native screenshot, preserve genuine X11 alternate evidence on known 1x1 failure
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 185s xvfb-run -a -s '-screen 0 1600x900x24 +extension GLX +render -noreset' \
            /tmp/g4c7-p2-live-gui-bin/blender-4.5.15-linux-x64/blender -t 2 \
            artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART/M37P2_DIRECT_AUTHOR_NATIVE_EDITOR_FIXED_REVIEW_V3_NOT_ART.blend \
            --python-exit-code 9 --python tools/g4c7_m37p2_live_gui_context_capture.py -- \
            --gui-ci-capture /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART
          native_status=$?
          set -e
          printf 'P2_NATIVE_BLENDER_SCREENSHOT_API_EXIT=%s\\n' "$native_status"
          if test "$native_status" -eq 0; then
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          d=Path('/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART')
          r=json.loads((d/'P2_ACTUAL_GUI_CONTEXT_HOLD.json').read_text())
          assert r['result']=='TRUE_GUI_VIEWPORTS_AND_NATIVE_SCENE_DATA_CAPTURED'
          assert r['source_is_protected_empty_v3'] is True
          assert r['bpy_background'] is False
          assert r['all_scene_mesh_count']==0
          assert r['no_model_calls'] is True
          assert r['human_gui_edited_by_this_script'] is False
          assert r['art']=='HOLD' and r['official_adoptions']==0
          assert r['minecraft']=='FORBIDDEN' and r['formal_331_993']=='NOT_RUN'
          assert set(r['views'])=={'MACRO_EDITOR','LIVED_EDITOR'}
          for name,v in r['views'].items():
              assert v['source']=='ACTUAL_BLENDER_GUI_VIEW_3D_NOT_CYCLES_RENDER'
              assert v['content_not_blank_black'] is True,name
              assert v['visible_bright_pixel_ratio']>=0.035,(name,v['visible_bright_pixel_ratio'])
              p=d/v['file']
              assert p.is_file() and p.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==v['sha256']
              assert v['width_px']>=100 and v['height_px']>=100
          assert Path('/tmp/G4C7_GUI_SMOKE_STATUS.txt').read_text().strip()=='0'
          print('PASS_TWO_AUTHENTIC_NATIVE_GUI_3D_EDITOR_SCREENSHOTS_NOT_CYCLES_ART_HOLD')
          PY
          else
            # The previous genuine Blender 4.5 screenshot_area created a 1x1
            # black PNG. Only this pinned exit(8) is recoverable, NEVER a crash.
            test "$native_status" -eq 8
            test "$(cat /tmp/G4C7_GUI_SMOKE_STATUS.txt)" = 8
            test -s /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_GUI_NATIVE_REGION_GEOMETRY_DIAGNOSTIC_ONLY.json
            test -s /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_X11_BLENDER_WINDOW_DIAGNOSTIC.json
            echo 'NATIVE_API_SCREENSHOT_FAILED; X11_EDITOR_PIXEL_SOURCE_REQUIRES_INDEPENDENT_STRICT_GATE'
          fi
          test -z "$(git status --porcelain -- artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART)"
      - name: Always diagnose X11 root and each viewport actual pixel content, even if Blender capture fails
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          try:
              from PIL import Image, ImageStat
          except ImportError:
              print('DIAGNOSTIC_PIL_UNAVAILABLE_NOT_ART_VERIFIED')
              raise
          base=Path('/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART')
          base.mkdir(parents=True,exist_ok=True)
          stats={}
          for label,name in (
              ('MACRO_EDITOR','P2_ACTUAL_GUI_MACRO_EDITOR.png'),
              ('LIVED_EDITOR','P2_ACTUAL_GUI_LIVED_EDITOR.png'),
              ('X11_ROOT_DIAGNOSTIC','P2_X11_ROOT_DIAGNOSTIC_ONLY.png'),
              ('X11_BLENDER_WINDOW_DIAGNOSTIC','P2_X11_BLENDER_FULL_WINDOW_DIAGNOSTIC_ONLY.png'),
          ):
              fn=base/name
              if not fn.is_file():
                  stats[label]={'exists':False}
                  continue
              with Image.open(fn) as im:
                  rgb=im.convert('RGB')
                  im.thumbnail((512,512))
                  colors=rgb.getcolors(rgb.width*rgb.height)
                  sample=rgb.resize((min(256,rgb.width),min(256,rgb.height)))
                  bright=sum(1 for p in sample.getdata() if max(p)>20)
                  ratio=bright/(sample.width*sample.height)
                  stats[label]={
                      'exists':True,
                      'size':[rgb.width,rgb.height],
                      'visible_bright_fraction':round(ratio,6),
                      'all_black':not bool(rgb.getbbox()),
                      'distinct_colors':len(colors) if colors is not None else 'more_than_count_limit'
                  }
          print('G4C7_INDEPENDENT_REAL_GUI_PIXEL_DIAGNOSTIC:',json.dumps(stats,sort_keys=True),flush=True)
          (base/'P2_INDEPENDENT_PIXEL_DIAGNOSTIC.json').write_text(json.dumps(stats,indent=2)+'\n')
          PY
      - name: Extract conservative Blender-window VIEW_3D region diagnostic if X11 image survived
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/g4c7_m37p2_x11_native_region_crop.py \
            --folder /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_X11_NATIVE_REGION_CROP_DIAGNOSTIC_ONLY.json')
          r=json.loads(p.read_text())
          assert r['art']=='HOLD' and r['official_adoptions']==0
          assert r['x11_crop_is_verified_blender_editor'] is False
          assert r['accepted_as_art'] is False and r['model_calls']==0
          assert r['minecraft']=='FORBIDDEN'
          print('P2_X11_CROPPED_REGIONS_DIAGNOSTIC_ONLY',r['status'])
          PY
      - name: Prove X11 actual Blender two-editor pixels are exact, bounded and non-black
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -p 'test_g4c7_m37p2_x11_visual_context_bridge.py' -v
          /usr/bin/python3 tools/g4c7_m37p2_x11_visual_context_bridge.py \
            --folder /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART')
          r=json.loads((d/'P2_X11_TWO_REAL_EDITOR_PIXEL_CONTEXT_HOLD.json').read_text())
          assert r['result']=='X11_TWO_LIVE_BLENDER_VIEW_3D_REGION_PIXELS_VERIFIED_READ_ONLY'
          assert set(r['views'])=={'MACRO_EDITOR','LIVED_EDITOR'}
          assert r['read_only_viewing_possible'] is True
          assert r['original_native_screenshot_area_proven_valid'] is False
          assert r['gui_auto_authoring_demonstrated'] is False
          assert r['model_calls']==0 and r['art']=='HOLD' and r['official_adoptions']==0
          assert r['minecraft']=='FORBIDDEN' and r['formal_331_993']=='NOT_RUN'
          print('PASS_TRUE_X11_BLENDER_EDITOR_PIXELS_READONLY_NOT_NATIVE_API_NOT_ART_NOT_GUI_AUTOMATION')
          PY
      - name: Always classify actual independent pixel evidence conservatively (NEVER ART PASS)
        if: always()
        run: |
          set -euo pipefail
          python3 -u tools/g4c7_m37p2_x11_differential_diagnosis.py \
            --source /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_INDEPENDENT_PIXEL_DIAGNOSTIC.json \
            --output /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_X11_NATIVE_GUI_DIFFERENTIAL_HOLD.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_X11_NATIVE_GUI_DIFFERENTIAL_HOLD.json')
          o=json.loads(d.read_text())
          assert o['art']=='HOLD' and o['official_adoptions']==0
          assert o['classification_is_root_cause_proof'] is False
          assert o['x11_window_is_editor_evidence'] is False
          assert o['minecraft']=='FORBIDDEN'
          print('P2_DIFFERENTIAL_REPORT_ARCHIVED_DIAGNOSTIC_ONLY',o['decision'])
          PY
      - name: Verify read-only X11 fallback or original native GUI gate; no model on empty scene
        run: |
          set -euo pipefail
          d=/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART
          if test -f "$d/P2_ACTUAL_GUI_CONTEXT_HOLD.json"; then
            python3 -u tools/g4c7_m37p2_local_gui_vision_review.py \
              --manifest "$d/P2_ACTUAL_GUI_CONTEXT_HOLD.json" \
              --out "$d/P2_LOCAL_VISION_GATE_ART_HOLD.json"
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_LOCAL_VISION_GATE_ART_HOLD.json')
          r=json.loads(p.read_text())
          assert r['decision']=='EMPTY_STUDIO_DIRECT_ART_REQUIRED'
          assert r['vision_review']['status']=='SKIPPED_EMPTY_STUDIO_NO_IMAGE_MODEL_CALL'
          assert r['new_geometry_produced'] is False
          assert r['art']=='HOLD' and r['official_adoptions']==0
          print('NATIVE_GUI_EMPTY_SCENE_READONLY_NO_MODEL')
          PY
          else
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/P2_X11_TWO_REAL_EDITOR_PIXEL_CONTEXT_HOLD.json')
          r=json.loads(p.read_text())
          assert r['result']=='X11_TWO_LIVE_BLENDER_VIEW_3D_REGION_PIXELS_VERIFIED_READ_ONLY'
          assert r['model_calls']==0 and r['real_city_art'] is False
          assert r['gui_auto_authoring_demonstrated'] is False
          assert r['official_adoptions']==0 and r['art']=='HOLD'
          print('X11_BLENDER_EDITOR_PIXELS_RECOVERED; NATIVE_SCREENSHOT_STILL_BROKEN; NO_MODEL_OR_ART')
          PY
          fi
      - name: Preserve actual viewport PNGs and native scene JSON, not art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-p2-actual-dual-live-gui-editor-context-no-art
          path: |
            /tmp/G4C7_P2_REAL_EDITOR_SCREENSHOTS_NON_ART/
            /tmp/G4C7_GUI_SMOKE_STATUS.txt
          if-no-files-found: warn
          retention-days: 14
