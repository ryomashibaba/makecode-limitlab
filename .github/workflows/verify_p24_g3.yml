name: Verify LimitLab P2.4 G3 Evidence
on:
  push:
    paths:
      - 'RUN_P24_G3.cmd'
      - 'tools/g3_evidence.py'
      - 'tools/P24_G2_ONE_CLICK.ps1'
      - 'tests/test_p24_g3.py'
      - 'docs/P24_G3_LIVE_QA_JA.md'
      - '.github/workflows/verify_p24_g3.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G3 ZIP evidence regression
        run: python -B -m unittest discover -s tests -p 'test_p24_g3.py' -v
      - name: G2 and G1 existing safety regressions
        run: |
          python -B -m unittest discover -s tests -p 'test_p24_g2.py' -v
          python -B -m unittest discover -s tests -p 'test_p24_qa.py' -v
      - name: No new files for missing evidence
        run: |
          python -B tools/g3_evidence.py --output-root /tmp/nonexistent-g3-input > /tmp/g3_result.json && exit 1 || true
          test ! -e /tmp/nonexistent-g3-input
          grep -q '"state": "BLOCKED"' /tmp/g3_result.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G3 packaging safety regression on Windows
        run: python -B -m unittest discover -s tests -p 'test_p24_g3.py' -v
      - name: Check PS 5.1 syntax and read-only Inspect with optional bundle
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\P24_G2_ONE_CLICK.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $root=Join-Path $env:RUNNER_TEMP 'G3_ReadOnlyInspect'
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File '.\tools\P24_G2_ONE_CLICK.ps1' -Mode Inspect -BundleResult -OutputRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'G3 inspect failed' }
          if (Test-Path $root) { throw 'Inspect wrote output files' }
          Write-Host 'Powershell parse + side-effect-free G3 inspect PASS'
