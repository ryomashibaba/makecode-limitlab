name: G4-C7 M24 ART-FIRST integrated landmark native study
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - "tools/g4c7_m24_art_first_native.py"
      - ".github/workflows/g4c7-m24-single-hero-landmark.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: g4c7-m24-art-first-native
  cancel-in-progress: false
jobs:
  new-editable-art-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin and fetch immutable M22 original native model
        uses: actions/download-artifact@v4
        with:
          name: g4c7-m22-real-landing-detour-ART-HOLD
          run-id: 41266602916
          github-token: ${{ github.token }}
          path: artifacts/m24_immutable_m22
      - name: Check M17 program and exact M22 SHA before Blender
        run: |
          python -m py_compile tools/g4c7_m24_art_first_native.py
          python tools/g4c7_m24_art_first_native.py --preflight
      - name: Install official native Blender Python
        run: |
          python -m pip install --disable-pip-version-check "bpy==4.5.15" --extra-index-url https://download.blender.org/pypi/bpy/
          python -c "import bpy; assert bpy.app.version[:2]==(4,5)"
      - name: Actual editable 3D research, housing and maker form, eight Cycles views
        run: python tools/g4c7_m24_art_first_native.py
      - name: Verify native geometry and views but never declare ART pass
        run: |
          python - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          p=Path('artifacts/g4c7-m24-single-integrated-hero-landmark')/('run_'+os.environ['GITHUB_SHA'][:12])
          m=json.loads((p/'manifest.json').read_text())
          assert m['art']=='HOLD_NOT_APPROVED' and m['adopted']==0 and m['minecraft_education']=='FORBIDDEN'
          assert m['formal_safety']=='NOT_RUN' and m['not_full_city'] and m['not_final_art']
          assert len(m['views'])==8 and m['new_meshes']>275
          for n,key,magic in (
           ('M24_EDITABLE_SINGLE_INHABITED_HERO.blend','native_blend_sha256',b'BLENDER'),
           ('M24_INTEGRATED_HERO_ART_HOLD.glb','glb_sha256',b'glTF')):
            b=(p/n).read_bytes()
            assert b.startswith(magic) and hashlib.sha256(b).hexdigest()==m[key]
          for name,v in m['views'].items():
            b=(p/('M24_'+name+'.png')).read_bytes()
            assert b[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack('>II',b[16:24])==(960,540)
            assert hashlib.sha256(b).hexdigest()==v['sha256']
          print('M24_TRUE_NATIVE_EDITABLE_ART_STUDY_EIGHT_VIEW_TECH_PASS_ART_HOLD')
          PY
      - name: Archive only new study, never overwrite or adopt prior source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-m24-single-hero-landmark-ART-HOLD
          path: artifacts/g4c7-m24-single-integrated-hero-landmark/run_*/
          retention-days: 21
          if-no-files-found: warn
