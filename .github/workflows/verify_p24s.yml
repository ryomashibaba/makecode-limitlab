name: Verify LimitLab P2.4S R2 Unique Run
on:
  push:
    paths:
      - 'makecode/limitlab_p24s_r2.ts'
      - 'makecode/COPY_P24S.ps1'
      - 'tools/analyze_p24s.py'
      - 'tools/p24s_capture.py'
      - 'tools/RUN_P24S_R2.ps1'
      - 'RUN_P24S_R2.cmd'
      - 'tests/test_p24s.js'
      - 'tests/test_p24s_tools.py'
      - 'docs/P24S_R2_UNIQUE_RUN_JA.md'
      - '.github/workflows/verify_p24s.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile R2 against same MakeCode API stubs
        run: npx --yes -p typescript@5.8.3 tsc --target es5 --module none --lib es5 --skipLibCheck --outFile build/limitlab_p24s_r2.js tests/makecode_p16_stub.d.ts makecode/limitlab_p24s_r2.ts
      - name: R2 voxel tests including non-empty missing CSV sentinel
        run: node tests/test_p24s.js
      - name: Private evidence and SHA pinned unique run tests
        run: python -B -m unittest discover -s tests -p 'test_p24s_tools.py' -v
      - name: Prior P2.3 P2.4R read-only analyzers are intact
        run: |
          python -B -m unittest discover -s tests -p 'test_p23_tools.py' -v
          python -B -m unittest discover -s tests -p 'test_p24r_tools.py' -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R2 one-shot preparer must choose unused folder, never overwrite previous run
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'P24S_R2_NEW_RUN'
          & powershell.exe -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File '.\makecode\COPY_P24S.ps1' -PrepareOnly -OutputRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'Fresh R2 preparation must succeed' }
          $paste=Join-Path $root 'PASTE_THIS_P24S_R2.ts'
          if (-not (Test-Path $paste)) { throw 'Missing new-run fallback source' }
          $source=[IO.File]::ReadAllText($paste)
          if (-not $source.Contains('player.onChat("labcity24s"')) { throw 'R2 command missing' }
          if ($source.Contains('__P24S_ROOT__')) { throw 'Unresolved per-run folder' }
          if (-not $source.Contains('P24S_R2_NEW_RUN')) { throw 'Wrong run folder' }
          $latch=Join-Path $root 'logs/P24S_ONCE.txt'
          if ([IO.File]::ReadAllText($latch) -cne 'READY_P24S') { throw 'R2 latch missing' }
          $saved=[IO.File]::ReadAllBytes($paste)
          & powershell.exe -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File '.\makecode\COPY_P24S.ps1' -PrepareOnly -OutputRoot $root
          if ($LASTEXITCODE -eq 0) { throw 'Duplicate run folder must be refused' }
          if ([IO.File]::ReadAllText($latch) -cne 'READY_P24S') { throw 'R2 latch overwritten' }
          if (-not [Linq.Enumerable]::SequenceEqual([byte[]]$saved,[byte[]][IO.File]::ReadAllBytes($paste))) {
            throw 'R2 clipboard fallback overwritten'
          }
          $tok=$null;$err=$null
          foreach ($file in @('.\makecode\COPY_P24S.ps1','.\tools\RUN_P24S_R2.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tok,[ref]$err)
            if ($err.Count -gt 0) { throw ($err | Out-String) }
          }
          Write-Host 'R2 Windows fresh folder and preservation PASS'
          exit 0
      - name: Python R2 private evidence regressions on Windows
        run: python -B -m unittest discover -s tests -p 'test_p24s_tools.py' -v
