name: G4C7 M37-P2 retired Qwen vertex pipeline Windows STOP guard NO ART
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - tools/g4c7_m37p2_run_local_ai_vertex_trial.ps1
      - tools/G4C7_P2_AI_Trial_Start.cmd
      - .github/workflows/g4c7-m37p2-windows-local-vertex-ai-first-art-prepare.yml
permissions:
  contents: read
jobs:
  real-windows-retirement-stop-before-ollama:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and verify the rejected single-shot approach now refuses all execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scriptPath=(Resolve-Path 'tools/g4c7_m37p2_run_local_ai_vertex_trial.ps1').Path
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          $cmd=Get-Content -Raw 'tools/G4C7_P2_AI_Trial_Start.cmd'
          if (-not $cmd.Contains('REJECTED QWEN VERTEX METHOD RETIRED')) {
            throw 'ONE_CLICK_COMMAND_NOT_RETIRED'
          }
          $p=Start-Process -FilePath 'powershell.exe' -Wait -PassThru -NoNewWindow `
            -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$scriptPath,'-PrepareOnly')
          if ($p.ExitCode -ne 2) { throw "RETIRED_PS1_MUST_STOP_WITH_2: $($p.ExitCode)" }
          if (-not (Get-Content -Raw $scriptPath).Contains('G4C7_P2_RETIRED_ART_FIRST_HOLD')) {
            throw 'RETIRED_PS1_GUARD_MISSING'
          }
          Write-Host 'WINDOWS_OLD_VERTEX_METHOD_RETIRED_NO_OLLAMA_NO_BLENDER_NO_WORLD_WRITE_PASS'
      - name: Preserve protected art originals
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART)"
