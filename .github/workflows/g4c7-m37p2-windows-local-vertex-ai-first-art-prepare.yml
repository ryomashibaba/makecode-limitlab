name: G4C7 M37-P2 local Windows Ollama AI vertex author preparatory checks NO ART
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - tools/g4c7_m37p2_run_local_ai_vertex_trial.ps1
      - .github/workflows/g4c7-m37p2-windows-local-vertex-ai-first-art-prepare.yml
permissions:
  contents: read
jobs:
  one-click-windows-prepare-only-pinned-v3-immutable:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Real Windows PowerShell parse + prepare an isolated session, no Ollama or geometry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'tools/g4c7_m37p2_run_local_ai_vertex_trial.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          $home = Join-Path $env:RUNNER_TEMP 'P2_WIN_AUTHOR_LOCAL_BASE'
          $s = Join-Path $home 'P2_DIRECT_ART_MOCK_EXISTING_USER_SESSION'
          New-Item -ItemType Directory -Path $s -Force | Out-Null
          $source = 'artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART/M37P2_DIRECT_AUTHOR_NATIVE_EDITOR_FIXED_REVIEW_V3_NOT_ART.blend'
          $original = '536e451c763c4326421b13285abf1056a3a11d755028f8ff20b54b99b08a0249'
          $from = Join-Path (Get-Location) $source
          if ((Get-FileHash $from -Algorithm SHA256).Hash.ToLowerInvariant() -ne $original) { throw 'PINNED_SOURCE_CHANGED' }
          Copy-Item -LiteralPath $from -Destination (Join-Path $s 'P2_DIRECT_AUTHOR_UNAPPROVED.blend')
          $scriptFull = (Resolve-Path $script).Path
          & $scriptFull -SessionRoot $home -BlenderExe (Join-Path $env:WINDIR 'System32/cmd.exe') -PrepareOnly
          $trials = @(Get-ChildItem -LiteralPath $s -Directory |
            Where-Object { $_.Name -like 'LOCAL_AI_EXPLICIT_VERTEX_TRIAL_*' })
          if ($trials.Count -ne 1) { throw 'EXPECTED_ONE_PREPARE_ONLY_AI_TRIAL' }
          $d=$trials[0].FullName
          $result = Get-Content (Join-Path $d 'SAFE_PREPARE_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($result.art -ne 'HOLD' -or $result.official_adoptions -ne 0 -or
              $result.minecraft -ne 'FORBIDDEN' -or
              $result.gui_direct_author -ne 'NOT_PERFORMED' -or
              $result.state -ne 'PREPARED_ONLY_NOT_ART') { throw 'GUARD_RISK' }
          $runner = Join-Path $d 'g4c7_m37p2_local_vertex_author.py'
          if (-not (Test-Path $runner)) { throw 'PINNED_PYTHON_RUNNER_NOT_DOWNLOADED' }
          python -m py_compile $runner
          $sourceAgain = Join-Path $s 'P2_DIRECT_AUTHOR_UNAPPROVED.blend'
          if ((Get-FileHash $sourceAgain -Algorithm SHA256).Hash.ToLowerInvariant() -ne $original) { throw 'STUDIO_WAS_MODIFIED' }
          Write-Host 'LOCAL_WINDOWS_NONWORK_LLM_AUTHOR_ONE_COMMAND_PREPARE_PASS_AI_MODEL_NOT_CALLED_ART_HOLD'
      - name: No GitHub protected original modifications
        shell: bash
        run: |
          test -z "$(git status --porcelain -- artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART)"
