name: G4-C7 B11-R5 D20-D21 real3D negative and preflight (ART HOLD)
on:
  push:
    branches:
      - dev/g4c7-a17-monolithic-rift-fold-art-study
    paths:
      - 'research/g4c7-b11-r5-d20-d21/**'
      - '.github/workflows/g4c7-b11-r5-d20-d21-true3d-rejection.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4c7-d20-d21-true3d-negative
  cancel-in-progress: true
jobs:
  saved-true3d-early-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research tools
        run: python -m pip install 'numpy>=1.26,<3' 'trimesh>=4.8,<5' 'vtk>=9.3,<10'
      - name: Install headless display libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb libosmesa6 libegl1 libgl1
      - name: Rebuild 3 saved true-3D conditions and 6 camera views
        run: xvfb-run -a python research/g4c7-b11-r5-d20-d21/d20_generator.py --out d20_repro
      - name: Independently audit saved GLB evidence
        run: python research/g4c7-b11-r5-d20-d21/d20_independent_audit.py --out d20_repro
      - name: Enforce D21 pre3D stop decision / negative tests
        run: python research/g4c7-b11-r5-d20-d21/d21_pre3d_stop_gate.py --out d20_repro
      - name: Prove no ART / QA / Minecraft promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('d20_repro')
          a=json.loads((p/'d20_independent_result.json').read_text())
          b=json.loads((p/'d21_pre3d_stop_gate.json').read_text())
          assert a['art']=='PRE-G0 ART REJECT' and a['negative_tests']==4
          assert a['adopted']==0 and a['construction']=='FORBIDDEN'
          assert a['formal_QA']['G0']=='NOT_RUN'
          assert b['promote_to_real3d'] is False and b['construction']=='FORBIDDEN'
          assert len(list(p.glob('d20_*.glb')))==3
          assert len(list(p.glob('*.png')))==6
          print('SUCCESS means negative evidence verified; NO ART PASS / NO construction')
          PY
      - name: Archive saved-GLB truth and rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D20-D21-SAVED-GLB-EARLY-ART-REJECT-NO-ADOPTION
          if-no-files-found: warn
          retention-days: 21
          path: d20_repro/
