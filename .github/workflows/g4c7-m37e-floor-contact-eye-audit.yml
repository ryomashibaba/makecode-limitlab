name: G4C7 M37-E native floor-contact and sightline independent audit ART HOLD
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - 'tools/g4c7_m37e_native_floor_contact_and_eye_audit.py'
      - '.github/workflows/g4c7-m37e-floor-contact-eye-audit.yml'
permissions:
  contents: write
concurrency:
  group: g4c7-m37e-floor-contact-audit-append-only
  cancel-in-progress: false
jobs:
  inspect-existing-native-city-without-changing-it:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax test; enforce pinned source and no art or safety claims
        run: |
          python -m py_compile tools/g4c7_m37e_native_floor_contact_and_eye_audit.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("artifacts/g4c7-m37d-verified-native-urban-fabric-art-hold")
          m=json.loads((root/"M37D_MANIFEST.json").read_text())
          p=root/m["saved_blend"]["name"]
          assert p.read_bytes()[:7]==b"BLENDER"
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["saved_blend"]["sha256"]
          assert m["art"]=="HOLD_UNREVIEWED"
          assert m["formal_331_993"]=="NOT_RUN"
          assert m["minecraft"]=="FORBIDDEN"
          print("M37E_M37D_NATIVE_PIN_ART_HOLD_NO_CONSTRUCTION")
          PY
      - name: Install exact native Blender API and small geometry-audit libraries
        run: |
          python -m pip install --disable-pip-version-check "bpy==4.5.15" "shapely==2.1.2" "networkx==3.4.2" --extra-index-url https://download.blender.org/pypi/bpy/
          python -c "import bpy,shapely,networkx;assert bpy.app.version[:2]==(4,5)"
      - name: Prove negative controls; compute real native floor contacts and nine camera first-hit polygons
        run: |
          python tools/g4c7_m37e_native_floor_contact_and_eye_audit.py --self-test
          python tools/g4c7_m37e_native_floor_contact_and_eye_audit.py --analyze
      - name: Independent report consistency check; forbid safety status promotion
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path("artifacts/g4c7-m37e-independent-contact-audit")
          j=json.loads((p/"M37E_NATIVE_FLOOR_CONTACT_AND_EYE_AUDIT.json").read_text())
          assert j["status"]=="METHOD_AUDIT_ONLY_NO_ART_OR_SAFETY_PASS"
          assert j["city_art"]=="M37D_ART_REJECT_UNCHANGED"
          assert j["formal_adoption"]==0 and j["Minecraft_writes"]==0
          assert j["Minecraft_construction"]=="FORBIDDEN"
          assert j["safety_limits"]["331_993"]=="NOT_RUN"
          assert j["safety_limits"]["G0_S1_G1_G2_G3"]=="NOT_RUN"
          floors=j["floor_proxy"]
          assert floors["count"]>=100
          assert floors["connected_components"]>=1
          assert 0<floors["gate_strict_component_floors"]<=floors["count"]
          assert j["nominal_door_lintels"]["count"]==113
          assert j["nominal_door_lintels"]["door_floor_on_gate_contact_component"]+j["nominal_door_lintels"]["door_floors_not_on_gate_contact_component"]==113
          assert len(j["camera_center_rays"])==9
          assert len({r["camera"] for r in j["camera_center_rays"]})==9
          assert len({(r["first_hit_polygon"],r["distance_research_units"]) for r in j["camera_center_rays"]})>=3, "camera transform regression"
          with (p/"M37E_GROUP_FLOOR_CONTACT.csv").open(newline="") as f:
            c=list(csv.DictReader(f))
          assert sum(int(x["floor_proxies"]) for x in c)==floors["count"]
          print("M37E_SAVED_READ_ONLY_REPORT_QA_PASS",floors)
          PY
      - name: Save append-only text evidence on research branch only
        run: |
          set -euo pipefail
          dst=artifacts/g4c7-m37e-v2-verified-native-contact-audit
          test ! -e "$dst"
          mkdir -p "$dst"
          cp artifacts/g4c7-m37e-independent-contact-audit/* "$dst/"
          cat > "$dst/README_JA.md" <<'TXT'
          # M37-E V2 独立ネイティブ床接続・視線監査（ART REJECT維持）
          
          **V1の保存済みレポートでは、非アクティブシーンの未評価matrix_worldからカメラ位置が同一になり、9本全ての視線結果が誤りだった。V1視線結果は無効。V2では独立カメラのlocation/rotation_eulerを使用し、異なるカメラ中心9件とヒット結果の多様性を必須検査に追加した。V1の床接続数とは区別して扱う。**
          
          既存M37-Dの真正BLENDをSHAピンで読み、実メッシュの床面が水平投影で正面積重複し、上面の高さ差が0.36研究単位以下のときのみ同じ「保守的な床接触候補成分」に分類。線接触・近接・階段の実歩行可能性は証明しない。このグラフで孤立していても、将来の専用接続が絶対不可能とは意味しない。
          
          9固定カメラの中央1本の実ポリゴンray first-hitを記録。視野全域の芸術評価や人体通行の代わりにはならない。
          
          **既存M37-D原本のジオメトリを書き換えていない**。Blenderのモデル作成／Minecraft施工は一切行わない。
          旧M35・M36・M37-C原本に変更なし。M37-D美術ART REJECT・正式採用0、正式331人体/993足元・G0/S1/G1/G2/G3はNOT RUN、Minecraft Education施工と都市統合は禁止、main変更とPR #53 merge禁止。
          TXT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$dst"
          git diff --cached --quiet && { echo 'No new independent audit';exit 1; }
          git commit -m 'research(g4c7): archive M37-E native floor contact and occlusion audit ART HOLD'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Keep time-limited logs even if archive fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-m37e-read-only-native-floor-contact-audit
          path: artifacts/g4c7-m37e-independent-contact-audit
          if-no-files-found: warn
          retention-days: 21
