name: G4-C7 A83-B10 two-dimensional urban-airfield evidence (ART HOLD)
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - 'artifacts/g4c7-a83-b10-source-airfield/source.tar.gz.b64.part*'
      - '.github/workflows/g4c7_a83_b10_source_airfield.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g4c7-a83-b10-source-only
  cancel-in-progress: false
jobs:
  source-2d-G0-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exactly authenticated original Python
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,io,tarfile
          from pathlib import Path
          root=Path('artifacts/g4c7-a83-b10-source-airfield')
          parts=[(root/('source.tar.gz.b64.part'+str(i))).read_text().strip() for i in range(4)]
          assert list(map(len,parts))==[1600,1600,1600,1220],'BAD_PART_LENGTH'
          z=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(z).hexdigest()=='31a123fb0e974dcf4879a2d419c16bbfd8c697ff35066033bd2d869166236fc8','SOURCE_SHA_BAD'
          expected={'b10_urban_airfield.py':'82a03b95813afff9edcb953a07f7e6406821dfbe8de55f61fda5d04841788ecd',
            'test_b10.py':'9cfbd66068a14fa8aeb0c880edc23afa8cc3f9bc1b4c001233620e4e2e948b05'}
          out=root/'project'
          assert not out.exists()
          out.mkdir()
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(z))) as t:
            assert set(t.getnames())==set(expected)
            for member in t:
              assert member.isfile() and member.name in expected
              data=t.extractfile(member).read()
              assert hashlib.sha256(data).hexdigest()==expected[member.name]
              (out/member.name).write_bytes(data)
          print('B10_AUTHOR_SOURCE_SHA_PASS')
          PY
      - name: Install the numerical source dependencies (not 3D)
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'scipy==1.17.0' 'matplotlib==3.10.8' 'Pillow==12.3.0'
      - name: Run ten source and destructive tests; render two source PNGs
        run: |
          cd 'artifacts/g4c7-a83-b10-source-airfield/project'
          python -m unittest -v test_b10
          python b10_urban_airfield.py
      - name: Inspect exact evidence; forbid art or safety overclaim
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          from PIL import Image,ImageStat
          p=Path('artifacts/g4c7-a83-b10-source-airfield/project')
          q=json.loads((p/'B10_AUDIT.json').read_text())
          assert q['source_preflight_pass'] and q['public_branch_count']==4
          assert q['source_2d_air_connected_at_5m_centre_clearance']
          assert q['labelled_clearance_components']==1 and q['public_node_labels']==[1]*7
          assert q['altered_civic_void_causes_envelope_change_cells']>100
          assert q['real_3d']=='NOT_RUN' and q['actual_floor']=='NOT_TESTED'
          assert q['formal_s1_g1_g2_g3']=='NOT_RUN'
          assert q['formal_art_adoptions']==0 and q['minecraft_construction']=='FORBIDDEN'
          files={}
          for n in ('B10_SOURCE_PLAN.png','B10_SOURCE_CENTRE.png'):
            f=p/n
            with Image.open(f) as im:
              assert im.format=='PNG' and im.width>900
              assert max(ImageStat.Stat(im.convert('RGB')).stddev)>7
            files[n]=hashlib.sha256(f.read_bytes()).hexdigest()
          (p/'B10_IMAGE_MANIFEST.json').write_text(json.dumps({
            'images_sha256':files,'g0':'SOURCE_2D_ONLY','art':'PRE_3D_DESIGN_REJECT',
            'formal_safety':'NOT_RUN','minecraft':'FORBIDDEN'},indent=2)+'\n')
          print('B10_SOURCE_G0_PASS__DESIGN_REJECT__FORMAL_QA_NOT_RUN')
          PY
      - name: Keep artifact if branch archive conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b10-source-airfield-PRE3D-REJECT
          path: 'artifacts/g4c7-a83-b10-source-airfield/project/'
          retention-days: 14
          if-no-files-found: warn
      - name: Append-only to Draft PR branch (never main)
        run: |
          set -euo pipefail
          D='artifacts/g4c7-a83-b10-source-airfield/project'
          BRANCH=dev/g4c7-a17-monolithic-rift-fold-art-study
          test -s "$D/B10_AUDIT.json"
          test -s "$D/B10_SOURCE_PLAN.png"
          test -s "$D/B10_SOURCE_CENTRE.png"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$D/"
          if git diff --cached --quiet; then echo 'Already archived';exit 0;fi
          git commit -m 'A83-B10: preserve actual 2D source art rejection, two views and ten tests'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
