name: G4-C7 A83-B4 source-drawn two-scale visual review (NOT ART PASS)
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - 'artifacts/g4c7-a83-b4-authorial-frontage/*.svg'
      - 'artifacts/g4c7-a83-b4-authorial-frontage/spatial_contract.json'
      - 'tools/g4c7_a83_b4_authorial_frontage.py'
      - '.github/workflows/g4c7_a83_b4_source_review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g4c7-a83-b4-source-review
  cancel-in-progress: false
jobs:
  source-only-two-scales:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only fail-closed design constraints
        run: |
          python -m unittest discover -s tests -p test_g4c7_a83_b4_authorial_frontage.py -v
          python tools/g4c7_a83_b4_authorial_frontage.py
      - name: Render the two SVGs as actual pixel images without claiming 3D
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow>=10,<13'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET
          import cairosvg
          from PIL import Image,ImageStat
          root=Path('artifacts/g4c7-a83-b4-authorial-frontage')
          report={'stage':'A83_B4_2D_SOURCE_IMAGES_NOT_3D','real_3d':'NOT_RUN','art':'HOLD','construction':'FORBIDDEN','images':{}}
          for name,expected in [('macro_authorial_section',(1600,900)),('public_eye_authorial_section',(1600,1000))]:
            src=root/(name+'.svg')
            ET.parse(src)
            dst=root/(name+'.png')
            if dst.exists():raise RuntimeError('DO_NOT_OVERWRITE_STUDY_IMAGE')
            cairosvg.svg2png(url=str(src),write_to=str(dst))
            with Image.open(dst) as im:
              assert im.format=='PNG' and im.size==expected
              assert max(ImageStat.Stat(im.convert('RGB')).stddev)>10
            report['images'][name]={'svg_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
                                    'png_sha256':hashlib.sha256(dst.read_bytes()).hexdigest()}
          out=root/'source_render_manifest.json'
          if out.exists():raise RuntimeError('DO_NOT_OVERWRITE_STUDY_MANIFEST')
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('A83_B4_TRUE_2D_RENDER_ONLY__NO_3D__ART_HOLD')
          PY
      - name: Save exact pixels even when branch push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a83-b4-two-scale-source-study-ART-HOLD-NO-3D
          path: |
            artifacts/g4c7-a83-b4-authorial-frontage/*.svg
            artifacts/g4c7-a83-b4-authorial-frontage/*.png
            artifacts/g4c7-a83-b4-authorial-frontage/*manifest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Append only to the Draft branch
        run: |
          set -euo pipefail
          BRANCH=dev/g4c7-a17-monolithic-rift-fold-art-study
          D=artifacts/g4c7-a83-b4-authorial-frontage
          test -s "$D/macro_authorial_section.png"
          test -s "$D/public_eye_authorial_section.png"
          test -s "$D/source_render_manifest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$D/macro_authorial_section.png" "$D/public_eye_authorial_section.png" "$D/source_render_manifest.json"
          if git diff --cached --quiet;then echo 'Already archived';exit 0;fi
          git commit -m 'A83-B4: append source-registered 2D pixels (ART HOLD, no real 3D)'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
