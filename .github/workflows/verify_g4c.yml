name: Verify LimitLab G4C C0 Pedestrian Grade
on:
  push:
    paths:
      - 'makecode/limitlab_g4c_c0.ts'
      - 'makecode/COPY_G4C.ps1'
      - 'tools/analyze_g4c.py'
      - 'tools/g4c_capture.py'
      - 'tools/RUN_G4C_C0.ps1'
      - 'RUN_G4C_C0.cmd'
      - 'tests/test_g4c.js'
      - 'tests/test_g4c_tools.py'
      - 'tests/makecode_g4b_stub.d.ts'
      - 'docs/G4C_C0_PEDESTRIAN_GRADE_JA.md'
      - '.github/workflows/verify_g4c.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Minecraft G4C geometry and six block palette against MakeCode stubs
        run: npx --yes -p typescript@5.8.3 tsc --target es5 --module none --lib es5 --skipLibCheck --outFile build/limitlab_g4c_c0.js tests/makecode_g4b_stub.d.ts makecode/limitlab_g4c_c0.ts
      - name: G4C full voxel geometry, architecture differentiation and safety regression
        run: node tests/test_g4c.js
      - name: Strict private G4C CSV and one-click source integrity tests
        run: python -B -m unittest discover -s tests -p 'test_g4c_tools.py' -v
      - name: P2.4S benchmark parser and earlier safety regressions
        run: |
          python -B -m unittest discover -s tests -p 'test_p24s_tools.py' -v
          python -B -m unittest discover -s tests -p 'test_p23_tools.py' -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify STA clipboard preparer, pinned source and exclusive run folder
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'G4C_C0_FRESH'
          & powershell.exe -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File '.\makecode\COPY_G4C.ps1' -PrepareOnly -OutputRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'Fresh G4C test preparation failed' }
          $source=Join-Path $root 'PASTE_THIS_G4C_C0.ts'
          if (-not (Test-Path $source)) { throw 'G4C source fallback not written' }
          $text=[IO.File]::ReadAllText($source)
          if (-not $text.Contains('player.onChat("labcityg4c"')) { throw 'G4C command missing' }
          if ($text.Contains('__G4C_ROOT__')) { throw 'G4C root placeholder unresolved' }
          if (-not $text.Contains('G4C_C0_FRESH')) { throw 'G4C run root not embedded' }
          if ([IO.File]::ReadAllText((Join-Path $root 'logs/G4C_ONCE.txt')) -cne 'READY_G4C') { throw 'Wrong latch' }
          $before=[IO.File]::ReadAllBytes($source)
          & powershell.exe -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File '.\makecode\COPY_G4C.ps1' -PrepareOnly -OutputRoot $root
          if ($LASTEXITCODE -eq 0) { throw 'Second run on existing root must be blocked' }
          $after=[IO.File]::ReadAllBytes($source)
          if ([Convert]::ToBase64String($before) -cne [Convert]::ToBase64String($after)) { throw 'Old source overwritten' }
          foreach ($file in @('.\makecode\COPY_G4C.ps1','.\tools\RUN_G4C_C0.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          Write-Host 'G4-C C0 PowerShell 5.1 and source integrity PASS'
          exit 0
      - name: G4C Python private result tests on Windows
        run: python -B -m unittest discover -s tests -p 'test_g4c_tools.py' -v
