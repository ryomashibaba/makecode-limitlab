name: G4C7 M37-M native Blender art-review workspace scope and rollback ART HOLD
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - tools/g4c7_m37m_blender_review_panel.py
      - tools/g4c7_m37m_build_native_review_studio.py
      - tools/g4c7_m37m_independent_reopen_review_audit.py
      - .github/workflows/g4c7-m37m-native-editor-review.yml
permissions:
  contents: write
concurrency:
  group: g4c7-m37m-native-art-review
  cancel-in-progress: true
jobs:
  saved-blend-visual-review-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict source pin and static compile
        run: |
          python -m py_compile tools/g4c7_m37m_blender_review_panel.py tools/g4c7_m37m_build_native_review_studio.py tools/g4c7_m37m_independent_reopen_review_audit.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("artifacts/g4c7-m37l-verified-native-city-master-art-hold")
          manifest=json.loads((root/"M37L_NATIVE_MASTER_MANIFEST.json").read_text())
          old=root/"M37L_SINGLE_CITY_AUTHOR_MASTER_ART_HOLD.blend"
          assert old.read_bytes()[:7]==b"BLENDER"
          assert hashlib.sha256(old.read_bytes()).hexdigest()==manifest["native_blend"]["sha256"]
          assert manifest["native_blend"]["sha256"]=="85397f2ddc41cff6ef53d26813c7c57b1420318de840e78b5f7ec5ec3762bfc4"
          assert manifest["art"]=="HOLD_UNREVIEWED"
          assert manifest["formal_331_993"]=="NOT_RUN" and manifest["minecraft"]=="FORBIDDEN"
          print("M37M_M37L_PIN_AND_ART_HOLD_CONFIRMED")
          PY
      - name: Install Blender 4.5 native Python API
        run: |
          python -m pip install --disable-pip-version-check "bpy==4.5.15" --extra-index-url https://download.blender.org/pypi/bpy/
          python -c "import bpy;assert bpy.app.version[:2]==(4,5)"
      - name: Create independent editable visual-review scene with embedded Blender sidebar
        run: python tools/g4c7_m37m_build_native_review_studio.py
      - name: Independent real native reopen and 199 mesh source fidelity, three editor roundtrips
        run: python tools/g4c7_m37m_independent_reopen_review_audit.py
      - name: Verify fail-closed status and camera proof; archive immutable evidence on research branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/g4c7-m37m-review-studio-CI")
          m=json.loads((p/"M37M_REVIEW_STUDIO_MANIFEST.json").read_text())
          a=json.loads((p/"M37M_INDEPENDENT_REOPEN_SCOPE_AUDIT.json").read_text())
          assert m["status"]=="METHOD_STUDIO_ONLY_ART_REJECT_SOURCE"
          assert a["result"]=="PASS_BOUNDED_GUI_AUTHORING_REVIEW_METHOD_ONLY"
          assert a["saved_source_fidelity"]=="ALL_199_M37L_MESHES_EXACT"
          assert a["formal_331_993"]=="NOT_RUN" and a["minecraft"]=="FORBIDDEN"
          assert a["user_art_adoption"]==0 and m["official_adoption"]==0
          assert len(m["review_renders"])==4 and a["fixed_native_camera_copy_count"]==9
          assert all(v['origin']=='M37L_GENUINE_SOURCE_RENDER_REUSED_NO_M37M_RERENDER' for v in m['review_renders'].values())
          assert len(a["detected_bad_edits"])==7
          print("M37M_APP_ORIGINAL_AND_NEGATIVE_CONTROLS_PASS")
          PY
          out=artifacts/g4c7-m37m-verified-native-review-workspace-art-hold
          test ! -e "$out"
          mkdir -p "$out"
          cp -p artifacts/g4c7-m37m-review-studio-CI/* "$out/"
          cp -p tools/g4c7_m37m_blender_review_panel.py tools/g4c7_m37m_build_native_review_studio.py tools/g4c7_m37m_independent_reopen_review_audit.py "$out/"
          cat > "$out/README_JA.md" <<'TXT'
          # M37-M：Blenderアーティスト審査ワークスペース（美術採用ではない）
          
          不採用M37-Lの真正BLENDを参照シーンとして元の199メッシュ・9カメラすべてを無変更のまま保持し、別のM37-Mシーンに独立編集コピー199メッシュと9カメラを用意したレビュー補助ツール。新都市の制作・ART PASSではない。
          
          使用法：保存済みM37M_DIRECT_AUTHORING_REVIEW_STUDIO_ART_HOLD.blendをBlenderで開き、M37M_DIRECT_AUTHORING_REVIEW_STUDIO_ART_HOLD シーンを選ぶ。Text Editorで埋め込みM37M_RUN_ONCE_TO_ENABLE_REVIEW_PANEL.pyを選び Run Script を一回実行（Blenderの安全制限を尊重し自動では起動しない）。3D ViewのNキー→M37-M Review パネルで Issue を選び、Select real issue objects + camera から実メッシュと9固定視点のうち該当視点を選ぶ。Preview 2-mesh edit と Revert trial は連続して実行する。Check edits remain in approved scope は限定範囲の編集検査で、人体安全認可ではない。
          
          局所試験は部屋床1メッシュと殻1メッシュを一緒にX方向へ0.1〜1研究単位動かすだけ。接合面の一体性・建築形態の完成・構造的連続性・人間の移動安全を証明しない。旧チューブ都市のART REJECTは継続。対象外の実メッシュ変更を検査で検出するが、復元ボタンが戻すのは2メッシュだけ。その他を手編集した場合は保存済み原本を再読込する。
          
          M35/M36/M37-K/L原本無変更。全体ART HOLD・正式採用0。正式331人体993足元・S1/G1/G2/G3 NOT RUN、Minecraft施工禁止。main未変更、PR #53 Draft。
          TXT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$out"
          git diff --cached --quiet && { echo 'No new archive'; exit 1; }
          git commit -m "research(g4c7): preserve M37-M native visual editing studio and independent audit ART HOLD"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Retain failed and passed attempts for analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-m37m-native-visual-review-workspace-ART-HOLD
          path: artifacts/g4c7-m37m-review-studio-CI
          if-no-files-found: warn
          retention-days: 21
