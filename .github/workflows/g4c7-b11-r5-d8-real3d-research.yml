name: G4-C7 B11-R5 D8 real 3D research audit (ART HOLD)
on:
  push:
    branches:
      - dev/g4c7-a17-monolithic-rift-fold-art-study
    paths:
      - "research/g4c7-b11-r5-d8/**"
      - ".github/workflows/g4c7-b11-r5-d8-real3d-research.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4c7-b11-r5-d8-research
  cancel-in-progress: true
jobs:
  genuine-mesh-and-visual-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual mesh and rendering libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh vtk Pillow networkx
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libxrender1 libxext6
      - name: Build two distinct persisted real-3D study meshes
        working-directory: research/g4c7-b11-r5-d8
        run: python build.py --variant both
      - name: Render all twelve views from persisted PLY, never sketches
        working-directory: research/g4c7-b11-r5-d8
        run: xvfb-run -a python render.py
      - name: Independently audit OBJ/GLB/PLY and representative ground route
        working-directory: research/g4c7-b11-r5-d8
        run: python audit.py
      - name: Audit representative sightline obstructions from persisted PLY
        working-directory: research/g4c7-b11-r5-d8
        run: python scene_visibility_audit.py
      - name: Assert limited technical results AND invariant art/safety holds
        working-directory: research/g4c7-b11-r5-d8
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audit.json').read_text())
          p={x['variant']:x for x in d}
          assert p['inhabited']['occupied_plots']==69
          assert p['depopulated']['occupied_plots']==17
          assert all(x['route_81_centerline_floor_witnesses']==81 for x in d)
          assert all(x['route_occupied_hits_total']==0 for x in d)
          assert all(x['fault_injection_blocker_detected'] for x in d)
          for name in ('inhabited','depopulated'):
              manifest=json.loads((Path(name)/'manifest.json').read_text())
              assert manifest['art']=='NOT_ADOPTED'
              assert manifest['formal_qa']=='NOT_RUN'
              assert manifest['minecraft']=='FORBIDDEN'
              assert (Path(name)/'study.glb').stat().st_size>1000
              assert (Path(name)/'six_views.png').stat().st_size>1000
          vis=json.loads(Path('visibility_audit.json').read_text())
          assert vis['inhabited']['maker_eye_to_machinery']['opaque_hits_by_role']
          assert vis['inhabited']['research_eye_to_exchange']['opaque_hits_by_role']
          print('PASS: limited study-data validation; G0 ART REJECT, formal QA NOT RUN, construction FORBIDDEN')
          PY
      - name: Upload exact real-3D research artifacts and audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4c7-b11-r5-d8-real3d-research-not-adopted
          if-no-files-found: warn
          retention-days: 14
          path: |
            research/g4c7-b11-r5-d8/inhabited/
            research/g4c7-b11-r5-d8/depopulated/
            research/g4c7-b11-r5-d8/audit.json
            research/g4c7-b11-r5-d8/visibility_audit.json
