name: G4-C7 B11-R5 D16 independent 2D subsection gate (ART HOLD)
on:
  push:
    branches:
      - dev/g4c7-a17-monolithic-rift-fold-art-study
    paths:
      - 'research/g4c7-b11-r5-d16/**'
      - '.github/workflows/g4c7-b11-r5-d16-pre3d-subset.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4c7-d16-geometric-subset
  cancel-in-progress: true
jobs:
  independent-2d-subset-not-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Shapely, not a 3D renderer
        run: python -m pip install 'shapely>=2.0,<3.0'
      - name: Recompute the documented subset from literal 2D polygons
        working-directory: research/g4c7-b11-r5-d16
        run: python d16_section_subset_gate.py
      - name: Enforce accurate non-adoption scope
        working-directory: research/g4c7-b11-r5-d16
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('d16_subset_results.json').read_text())
          assert len(x['variants'])==2
          assert x['full_local_source_present_in_GitHub'] is False
          assert x['true_3D']=='NOT_RUN' and x['G0']=='NOT_RUN'
          assert x['adopted']==0 and x['construction']=='FORBIDDEN'
          assert all(a['art']=='PRE-3D ART REJECT' for a in x['variants'])
          print('SUBSET PASS ONLY: independent planar regressions; G0 NOT RUN; zero accepted; no Minecraft')
          PY
      - name: Save subset witness, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d16-independent-2d-subset-NO-ADOPTION
          if-no-files-found: warn
          retention-days: 14
          path: research/g4c7-b11-r5-d16/d16_subset_results.json
