name: G4C7 R1 true visible GUI chosen habitat boundary edit TECH NOT ART
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - tools/g4c7_r1_visible_gui_boundary_feedback.py
      - tools/g4c7_r1_visible_gui_boundary_input.sh
      - tools/g4c7_r1_visible_gui_pixel_guard.py
      - .github/workflows/g4c7-r1-visible-gui-image-gated-boundary.yml
permissions:
  contents: write
concurrency:
  group: g4c7-r1-one-visible-gui-boundary-method
  cancel-in-progress: false
jobs:
  only-isolated-rejected-city-method:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      G4C7_VISUAL_EDIT_OUT: /tmp/g4c7-r1-image-gated-author-method
      XDG_CONFIG_HOME: /tmp/g4c7-r1-image-gated-isolated-prefs
    steps:
      - uses: actions/checkout@v4
      - name: Pin rejected source, protected v3, no change to originals or main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev/g4c7-a17-monolithic-rift-fold-art-study"
          rejected=artifacts/g4c7-r1-civic-estuary-20261103-EARLY-ART-REJECT/R1_CIVIC_ESTUARY_GUI_DIRECT_EDIT_NOT_ART.blend
          protected=artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART/M37P2_DIRECT_AUTHOR_NATIVE_EDITOR_FIXED_REVIEW_V3_NOT_ART.blend
          echo "cadf0678f7a57636dbebe7432e95d4aae98a2a0cc57215652177d9cbd6ef0e06  $rejected" | sha256sum -c -
          echo "536e451c763c4326421b13285abf1056a3a11d755028f8ff20b54b99b08a0249  $protected" | sha256sum -c -
          bash -n tools/g4c7_r1_visible_gui_boundary_input.sh
          python3 -m py_compile tools/g4c7_r1_visible_gui_boundary_feedback.py tools/g4c7_r1_visible_gui_pixel_guard.py
          mkdir -p "$G4C7_VISUAL_EDIT_OUT"
      - name: Install real X11, screenshot and independent pixels library
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth xdotool scrot python3-pil libgl1 libegl1 libxkbcommon0 libxi6 libxrender1 libsm6 libxrandr2 libxxf86vm1
      - name: Pinned official Blender 4.5.15 with official checksum
        run: |
          set -euo pipefail
          mkdir -p /tmp/g4c7-r1-blender-feedback
          cd /tmp/g4c7-r1-blender-feedback
          curl -fsSL --retry 3 --max-time 240 -o release.sha256 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256
          curl -fsSL --retry 3 --max-time 240 -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz
          checksum="$(grep -F blender-4.5.15-linux-x64.tar.xz release.sha256 | awk '{print $1}')"
          echo "$checksum  blender.tar.xz" | sha256sum -c -
          tar -xf blender.tar.xz
          test -x blender-4.5.15-linux-x64/blender
      - name: Prepare new isolated GUI scene and select exact existing habitat vestibule partition
        run: |
          set -euo pipefail
          blender=/tmp/g4c7-r1-blender-feedback/blender-4.5.15-linux-x64/blender
          source=artifacts/g4c7-r1-civic-estuary-20261103-EARLY-ART-REJECT/R1_CIVIC_ESTUARY_GUI_DIRECT_EDIT_NOT_ART.blend
          timeout 75s "$blender" -b "$source" -t 2 --python-exit-code 34 --python tools/g4c7_r1_visible_gui_boundary_feedback.py -- prepare 2>&1 | tee "$G4C7_VISUAL_EDIT_OUT/R1_PREPARE_LOG.txt"
          prepared="$G4C7_VISUAL_EDIT_OUT/R1_REJECTED_ARCHITECTURE_BOUNDARY_GUI_METHOD_SOURCE_NOT_ART.blend"
          test -s "$prepared"
          echo "G4C7_VISUAL_PREPARED_SHA256=$(sha256sum "$prepared" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Actual X11 visible BEFORE image gate, then GUI G X 2 and AFTER frame
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          blender=/tmp/g4c7-r1-blender-feedback/blender-4.5.15-linux-x64/blender
          timeout 75s "$blender" -b -t 2 --python-exit-code 35 --python-expr "import bpy; assert 'FINISHED' in bpy.ops.wm.save_userpref()"
          prepared="$G4C7_VISUAL_EDIT_OUT/R1_REJECTED_ARCHITECTURE_BOUNDARY_GUI_METHOD_SOURCE_NOT_ART.blend"
          timeout --signal=TERM --kill-after=12s 160s xvfb-run -a -s '-screen 0 1600x900x24 +extension GLX +render -noreset' \
            bash tools/g4c7_r1_visible_gui_boundary_input.sh "$blender" "$prepared" "$G4C7_VISUAL_EDIT_OUT"
      - name: Independent new Blender process reload and exactly one meaningful mesh transform
        run: |
          set -euo pipefail
          blender=/tmp/g4c7-r1-blender-feedback/blender-4.5.15-linux-x64/blender
          copy="$G4C7_VISUAL_EDIT_OUT/R1_REJECTED_ARCHITECTURE_BOUNDARY_GUI_METHOD_EDITED_NOT_ART.blend"
          timeout 85s "$blender" -b "$copy" -t 2 --python-exit-code 36 --python tools/g4c7_r1_visible_gui_boundary_feedback.py -- verify 2>&1 | tee "$G4C7_VISUAL_EDIT_OUT/R1_INDEPENDENT_REOPEN_LOG.txt"
          rejected=artifacts/g4c7-r1-civic-estuary-20261103-EARLY-ART-REJECT/R1_CIVIC_ESTUARY_GUI_DIRECT_EDIT_NOT_ART.blend
          protected=artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART/M37P2_DIRECT_AUTHOR_NATIVE_EDITOR_FIXED_REVIEW_V3_NOT_ART.blend
          echo "cadf0678f7a57636dbebe7432e95d4aae98a2a0cc57215652177d9cbd6ef0e06  $rejected" | sha256sum -c -
          echo "536e451c763c4326421b13285abf1056a3a11d755028f8ff20b54b99b08a0249  $protected" | sha256sum -c -
          test -z "$(git status --porcelain -- "$rejected" "$protected")"
      - name: Preserve all provenance including negative evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-r1-visible-native-gui-habitat-boundary-method-TECH-NOT-ART
          path: /tmp/g4c7-r1-image-gated-author-method/
          retention-days: 30
          if-no-files-found: warn
      - name: Append-only permanent archive after PASS, never art adoption
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev/g4c7-a17-monolithic-rift-fold-art-study"
          remote="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if test "$remote" != "$GITHUB_SHA"; then
            echo "REMOTE_ADVANCED_SAFE_STOP_NO_FORCE"; exit 37
          fi
          src="$G4C7_VISUAL_EDIT_OUT"
          test -s "$src/INDEPENDENT_REOPEN_METHOD_AUDIT.json"
          test -s "$src/X11_VIEW_CHANGED_POST_EDIT.json"
          dst=artifacts/g4c7-r1-real-visible-gui-habitat-boundary-method-TECH-NOT-ART
          test ! -e "$dst"
          mkdir -p "$dst"
          cp "$src"/*.blend "$dst/"
          cp "$src"/*.png "$dst/"
          cp "$src"/*.json "$dst/"
          (cd "$dst"; sha256sum *.blend *.png *.json > SHA256_METHOD_EVIDENCE.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git commit -m "G4C7: append-only one visual-image-gated real GUI habitat author method, TECH not ART"
          git push origin "HEAD:$GITHUB_REF_NAME"
