name: G4C7 M37-D native occupied urban fabric review (ART HOLD)
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - tools/g4c7_m37d_new_native_occupied_city.py
      - .github/workflows/g4c7-m37d-native-occupied-fabric.yml
permissions:
  contents: write
concurrency:
  group: g4c7-m37d-native-fabric-append-only
  cancel-in-progress: false
jobs:
  native-art-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and pin pristine M35/M36 archive and safety statuses
        run: |
          python -m py_compile tools/g4c7_m37d_new_native_occupied_city.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          m35=Path('artifacts/g4c7-m35-pinned-native-art-reject')
          j=json.loads((m35/'M35_MANIFEST.json').read_text())
          assert hashlib.sha256((m35/j['blend']['file']).read_bytes()).hexdigest()==j['blend']['sha256']
          assert j['art']=='HOLD_NOT_ADOPTED' and j['official_adoption']==0
          m36=Path('artifacts/g4c7-m36-verified-native-author-studio')
          k=json.loads((m36/'M36_NATIVE_STUDIO_MANIFEST.json').read_text())
          assert hashlib.sha256((m36/k['saved_blend']['file']).read_bytes()).hexdigest()==k['saved_blend']['sha256']
          assert k['whole_city_art']=='HOLD_NOT_PASSED'
          assert k['formal_331_993']=='NOT_RUN' and k['construction']=='FORBIDDEN'
          print('M37D_TWO_ORIGINAL_NATIVE_ARCHIVES_PINNED_NO_CONSTRUCTION')
          PY
      - name: Install Blender 4.5 native API
        run: |
          python -m pip install --disable-pip-version-check 'bpy==4.5.15' --extra-index-url https://download.blender.org/pypi/bpy/
          python -c "import bpy;assert bpy.app.version[:2]==(4,5)"
      - name: Author new city as independent native scene; render nine cameras
        run: |
          python tools/g4c7_m37d_new_native_occupied_city.py
      - name: Independently reopen saved .blend and verify original scenes, authored geometry, provenance
        run: |
          python - <<'PY'
          import bpy,json,hashlib
          from pathlib import Path
          folder=Path('artifacts/g4c7-m37d-native-study')
          m=json.loads((folder/'M37D_MANIFEST.json').read_text())
          p=folder/m['saved_blend']['name']
          assert p.read_bytes()[:7]==b'BLENDER'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['saved_blend']['sha256']
          def snap(scene):
              ret={}
              for o in scene.objects:
                  if o.type!='MESH':continue
                  ret[o.name]={
                   'vertices':[tuple(float(x) for x in v.co) for v in o.data.vertices],
                   'faces':[tuple(f.vertices) for f in o.data.polygons],
                   'basis':tuple(float(x) for row in o.matrix_basis for x in row),
                   'parent':o.parent.name if o.parent else None}
              return ret
          bpy.ops.wm.open_mainfile(filepath=str(p.resolve()))
          ref=bpy.data.scenes['M35_REJECTED_REFERENCE_LOCKED']
          edit=bpy.data.scenes['M36_AUTHORING_STUDIO_ART_HOLD']
          study=bpy.data.scenes['M37D_AUTHOR_OCCUPIED_CITY_ART_HOLD']
          frozen_ref=snap(ref);frozen_edit=snap(edit)
          native=[o for o in study.objects if o.type=='MESH']
          assert len(frozen_ref)==len(frozen_edit)==208
          assert len(native)==sum(m['new_mesh_counts'].values())
          assert len(native)>=180,len(native)
          assert study.get('M37D_ART_STATUS')=='UNREVIEWED_HOLD'
          assert study.get('M37D_MINECRAFT')=='FORBIDDEN'
          assert study.get('M37D_FORMAL_331_993')=='NOT_RUN'
          assert study.get('M37D_OFFICIAL_ADOPTION')==0
          assert all(o.name.startswith('M37D_') for o in native)
          assert len({o.data.as_pointer() for o in native})==len(native)
          assert len([o for o in study.objects if o.type=='CAMERA'])==9
          assert m['art']=='HOLD_UNREVIEWED'
          assert m['formal_331_993']=='NOT_RUN' and m['minecraft']=='FORBIDDEN'
          for key,it in m['rendered_cameras'].items():
              im=folder/it['file']
              assert im.read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
              assert hashlib.sha256(im.read_bytes()).hexdigest()==it['sha256']
          assert len(m['rendered_cameras'])==9
          assert m['spatial_components']['named_door_openings']>30
          # Original scenes are independently loaded from *pinned M36 source*.
          source=Path('artifacts/g4c7-m36-verified-native-author-studio/M36_NATIVE_DUAL_SCENE_ARTIST_STUDIO.blend')
          bpy.ops.wm.open_mainfile(filepath=str(source.resolve()))
          pristine_ref=snap(bpy.data.scenes['M35_REJECTED_REFERENCE_LOCKED'])
          pristine_edit=snap(bpy.data.scenes['M36_AUTHORING_STUDIO_ART_HOLD'])
          def compare(a,b,label):
              assert set(a)==set(b),label
              max_diff=0.0
              for key in a:
                  x,y=a[key],b[key]
                  assert x['faces']==y['faces'],(label,key,'faces')
                  assert x['parent']==y['parent'],(label,key,'parent')
                  assert len(x['vertices'])==len(y['vertices']),(label,key,'vertex count')
                  for aa,bb in zip(x['vertices'],y['vertices']):
                      for xx,yy in zip(aa,bb):max_diff=max(max_diff,abs(xx-yy))
                  for xx,yy in zip(x['basis'],y['basis']):max_diff=max(max_diff,abs(xx-yy))
              assert max_diff<1e-5,(label,max_diff)
              return max_diff
          referr=compare(frozen_ref,pristine_ref,'M35_REFERENCED_SCENE')
          editerr=compare(frozen_edit,pristine_edit,'M36_EDITABLE_SCENE')
          report={
           'status':'PASS_NATIVE_SOURCE_ISOLATION_AND_SAVED_RENDER_EVIDENCE_ONLY',
           'reference_meshes_unchanged':208,
           'original_editor_meshes_unchanged':208,
           'native_study_meshes':len(native),
           'native_cameras':9,
           'saved_render_sha_checks':9,
           'reference_max_native_roundtrip_diff':referr,
           'editable_max_native_roundtrip_diff':editerr,
           'real_bays':m['spatial_components'],
           'new_city_ART':'HOLD_UNREVIEWED',
           'formal_331_993':'NOT_RUN','route_continuity':'NOT_RUN',
           'Minecraft':'FORBIDDEN'}
          (folder/'M37D_INDEPENDENT_REOPEN_AUDIT.json').write_text(
            json.dumps(report,indent=2,ensure_ascii=False),encoding='utf8')
          print(json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - name: Record limitations and copy append-only native evidence
        run: |
          set -euo pipefail
          dest=artifacts/g4c7-m37d-verified-native-urban-fabric-art-hold
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -p artifacts/g4c7-m37d-native-study/* "$dest/"
          cat > "$dest/README_JA.md" <<'TXT'
          # M37-D 新しい建築組織／単一Blenderシーン美術探索 — ART HOLD
          
          M35旧不採用・M36検証済編集環境から派生。ただし実際の建築候補はM37D_AUTHOR_OCCUPIED_CITY_ART_HOLDという別の新しいネイティブ3Dシーンで作者bpy編集。既存M35とM36の208＋208メッシュを独立照合して不変を確認する。
          
          公共広場4箇所、開放造船ヤード、室内床、入口、居住・研究・製造・文化の各ベイ、立体階段が同一保存3Dモデルに存在。全施設の間の安全な連続歩行、実生活の使い勝手、支持・避難・頭上クリアランスは未検証。全体構造の美しさも未審査。マーカー・用途ラベルは建築の安全/美術を保証しない。外形が箱・棚・キャンパスに見えるならART REJECTする。
          
          写真はこの同一保存Blenderモデルの9視点から生成。人間によるBlender GUI手編集を行ったとは主張しない。R1「作者による直接ネイティブ」研究段階であり、建築ジェネレーターの一般化にも達していない。
          
          **ART HOLD／正式採用0／331人体・993足元NOT RUN／G0 S1 G1 G2 G3 NOT RUN／MakeCode施工禁止／main変更禁止／PR#53 Draft継続。**
          TXT
      - name: Commit native output only if entire separate audit passed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/g4c7-m37d-verified-native-urban-fabric-art-hold
          git diff --cached --quiet && { echo 'M37D output not found';exit 1; }
          git commit -m 'research(g4c7): archive M37-D native urban art study with 9-view evidence ART HOLD'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Temporary evidence artifact; no safety or art approval
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4c7-m37d-native-art-study-HOLD
          path: artifacts/g4c7-m37d-native-study/
          retention-days: 21
          if-no-files-found: warn
