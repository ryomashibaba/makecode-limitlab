name: G4C7 A13 megafold A-B-C art comparison (NO MINECRAFT)
on:
  push:
    branches: [dev/g4c7-a13-unified-megafold-comparative-study]
    paths:
      - 'tools/g4c7_a13_megafold_comparative.py'
      - 'docs/G4C7_A13_UNIFIED_MEGAFOLD_ART_HOLD_JA.md'
      - '.github/workflows/verify_g4c7_a13_megafold.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4c7-a13-latest-art-study
  cancel-in-progress: true
jobs:
  build-validate-both-models:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact offline geometry dependencies
        run: python -m pip install numpy==2.2.6 trimesh==4.6.13 manifold3d==3.2.1 scipy==1.15.3 networkx==3.5 pillow==11.3.0
      - name: Build three actual GLB/OBJ plus four identical-camera four-way comparisons
        run: |
          python tools/g4c7_a13_megafold_comparative.py \
            --input artifacts/g4c7-a12/a12_exposed_atrium_canyon.glb \
            --out build/g4c7_a13
      - name: Strict A12 input, positive-volume models, unchanged person-envelope and negative control
        run: |
          python - <<'PY'
          import json,trimesh
          from pathlib import Path
          d=Path('build/g4c7_a13')
          q=json.loads((d/'a13_comparative_geometry_qa.json').read_text())
          assert q['input_a12_meshes']==619
          assert q['source_route']['body_collision_samples']==45
          assert q['source_route']['unsupported_foot_samples']==0
          assert q['art_status']=='HOLD'
          assert q['construction']=='PROHIBITED'
          assert q['city_integration']=='PROHIBITED'
          assert q['minecraft_walk']=='NOT TESTED'
          assert q['source_a12_unchanged']
          assert q['all_private_worlds_used_csv_zip']=='UNTOUCHED'
          for mark,count,omissions in [('a',624,0),('b',622,2),('c',616,4)]:
              v=q['variants'][mark]
              assert v['meshes']==count
              assert len(v['art_form']['old_outer_shells_omitted'])==omissions
              assert v['art_form']['new_mass_volume']>1000
              if mark=='c':
                  assert v['real_output_bounds'][1][1]>90
                  assert v['art_form']['new_mass_bounds'][1][1]<60
              else:
                  assert v['real_output_bounds'][1][1]>100
              assert len(v['art_form']['raking_members'])==(0 if mark=='c' else 4)
              assert all(b['closed_volume']>100 for b in v['art_form']['raking_members'])
              c=v['original_legacy_path']
              assert c['route_samples']==331 and c['foot_support_samples']==993
              assert c['body_envelope']['half_xz']==0.65
              assert c['body_envelope']['from_foot_y']==0.15
              assert c['body_envelope']['to_foot_y']==3.25
              assert c['negative_intentional_blocker_detected']
              assert c['unsupported_foot_samples']==0
              assert c['body_surface_intersection_sample_count']<=45
              m=trimesh.load(d/('a13_'+mark+'_unified_megafold.glb'),force='scene')
              assert len(m.graph.nodes_geometry)==count
              mass=v['art_form']['new_mass_name']
              assert mass in m.graph.nodes_geometry
              outer=('NORTH outer load shell','SOUTH outer load shell_A7_PORTAL_A9_FLARED')
              for name in outer: assert (name in m.graph.nodes_geometry)==(mark=='a')
              inners=('NORTH inner load shell','SOUTH inner load shell_A7_PORTAL')
              for name in inners: assert (name in m.graph.nodes_geometry)==(mark!='c')
              t,key=m.graph[mass]
              assert m.geometry[key].is_watertight and m.geometry[key].is_volume
          for view in ['front','oblique','side','aerial']:
              assert (d/'fourview'/(view+'_a12_a13a_a13b_a13c.png')).stat().st_size>2000
          print('PASS: three true A13 volumes, unmodified old corridor, true 4-view comparison')
          print('ART HOLD, no engineering, no construction, no city integration')
          PY
      - name: Upload all comparative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-a13-real-a-b-megafold-four-triptychs-art-hold
          path: build/g4c7_a13/
          if-no-files-found: warn
          retention-days: 14
  persist-a13-results:
    needs: [build-validate-both-models]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/g4c7-a13-unified-megafold-comparative-study'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g4c7-a13-real-a-b-megafold-four-triptychs-art-hold
          path: build/g4c7_a13
      - name: Archive independent A/B models and 4 tri-view PNGs
        run: |
          set -euo pipefail
          d=artifacts/g4c7-a13
          mkdir -p "$d/fourview"
          for f in a13_a_unified_megafold.glb a13_a_unified_megafold.obj a13_b_unified_megafold.glb a13_b_unified_megafold.obj a13_c_unified_megafold.glb a13_c_unified_megafold.obj a13_comparative_geometry_qa.json; do
            test -s "build/g4c7_a13/$f"
            cp "build/g4c7_a13/$f" "$d/"
          done
          for v in front oblique side aerial; do
            test -s "build/g4c7_a13/fourview/$v"_a12_a13a_a13b_a13c.png
            cp "build/g4c7_a13/fourview/$v"_a12_a13a_a13b.png "$d/fourview/"
          done
          cp build/g4c7_a13/fourview/provenance.json "$d/fourview/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/g4c7-a13
          if ! git diff --cached --quiet; then
            git commit -m 'G4C7 A13: archive two real megafold studies with four four-way art comparisons (ART HOLD)'
            git push origin HEAD:dev/g4c7-a13-unified-megafold-comparative-study
          fi
