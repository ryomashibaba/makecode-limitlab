name: G4C7 M19B isolate coplanar street junction rendering
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - "tools/g4c7_d3s26_m19b_street_overlap.py"
      - ".github/workflows/g4c7-m19b-street-overlap.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: g4c7-m19b-junction
  cancel-in-progress: false
jobs:
  isolate-junction:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover original native M19A evidence without modifying it
        uses: actions/download-artifact@v4
        with:
          name: g4c7-m19a-floor-normal-isolation-ART-HOLD
          run-id: 41262949996
          github-token: ${{ github.token }}
          path: artifacts/m19b_pinned_m19a_native_seed
      - name: Check source pin and compile before downloading Blender
        run: |
          python -m py_compile tools/g4c7_d3s26_m19b_street_overlap.py
          python tools/g4c7_d3s26_m19b_street_overlap.py --preflight
      - name: Install native official Blender Python
        run: |
          python -m pip install --disable-pip-version-check "bpy==4.5.15" --extra-index-url https://download.blender.org/pypi/bpy/
          python -c "import bpy; assert bpy.app.version[:2]==(4,5)"
      - name: Modify only 2 coplanar street surfaces, render 8 identical cameras
        run: python tools/g4c7_d3s26_m19b_street_overlap.py
      - name: Check image and native 3-D evidence identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,struct
          p=Path('artifacts/g4c7-m19b-street-junction-overlap-test')/('run_'+os.environ['GITHUB_SHA'][:12])
          m=json.loads((p/'manifest.json').read_text())
          assert m['art']=='HOLD_NOT_APPROVED' and m['minecraft']=='FORBIDDEN'
          assert m['camera_material_lights_fixed'] and m['zero_new_objects']
          assert len(m['changed_only_road_surface_local_z'])==2 and len(m['views'])==8
          for n,key,magic in (
           ('M19B_EDITED_JUNCTION_NATIVE.blend','native_blend_sha256',b'BLENDER'),
           ('M19B_STREET_OVERLAP_TEST_ART_HOLD.glb','glb_sha256',b'glTF')):
            b=(p/n).read_bytes()
            assert b.startswith(magic) and hashlib.sha256(b).hexdigest()==m[key]
          for name,meta in m['views'].items():
            b=(p/('M19B_'+name+'.png')).read_bytes()
            assert b[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack('>II',b[16:24])==(960,540)
            assert hashlib.sha256(b).hexdigest()==meta['sha256']
          print('M19B_NATIVE_FIXED_CAMERA_EIGHT_IMAGE_TECH_PASS_ART_HOLD')
          PY
      - name: Preserve M19B only, do not overwrite M19A or protected branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-m19b-street-overlap-isolation-ART-HOLD
          path: artifacts/g4c7-m19b-street-junction-overlap-test/run_*/
          retention-days: 21
          if-no-files-found: warn
