name: G4C7 M37-P2 native editor paired operations REAL Blender tech NO ART
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - tools/g4c7_m37p2_native_operator_author.py
      - tests/test_g4c7_m37p2_paired_operator_native.py
      - tools/g4c7_m37p2_paired_operator_three_view_evidence.py
      - tools/g4c7_m37p2_visual_feedback_gate.py
      - tests/test_g4c7_m37p2_visual_feedback_gate.py
      - tools/g4c7_m37p2_ollama_paired_native_action_proposal.py
      - tests/test_g4c7_m37p2_ollama_paired_operator_proposal.py
      - .github/workflows/g4c7-m37p2-paired-operator-native-blender-smoke.yml
permissions:
  contents: read
concurrency:
  group: g4c7-m37p2-paired-operator-native
  cancel-in-progress: true
jobs:
  replay-two-paired-native-artist-actions-on-immutable-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict structured actions, no arbitrary code execution
        run: |
          set -euo pipefail
          python -m py_compile tools/g4c7_m37p2_native_operator_author.py tools/g4c7_m37p2_ollama_paired_native_action_proposal.py
          python -m unittest discover -s tests -p 'test_g4c7_m37p2_paired_operator_native.py' -v
          python -m unittest discover -s tests -p 'test_g4c7_m37p2_ollama_paired_operator_proposal.py' -v
          python -m unittest discover -s tests -p 'test_g4c7_m37p2_visual_feedback_gate.py' -v
      - name: Install real bpy 4.5 native runtime (source v3)
        run: |
          python -m pip install --disable-pip-version-check 'bpy==4.5.15' --extra-index-url https://download.blender.org/pypi/bpy/
          python -c "import bpy; assert bpy.app.version[:2] == (4,5)"
      - name: Generate ephemeral paired non-art author actions for actual Blender operators
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          t=Path('tests/test_g4c7_m37p2_paired_operator_native.py')
          spec=importlib.util.spec_from_file_location('study_fixture',t)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          target=Path('/tmp/G4C7_PAIR_NON_ART_FIXTURE.json')
          target.write_text(json.dumps(module.technical_fixture_not_art()))
          print('ONE_PAIR_ONLY_TECH_FIXTURE_NON_ART')
          PY
      - name: Replay native Blender operators on separate saved test study (not city art)
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 360s python -u tools/g4c7_m37p2_native_operator_author.py \
             --source artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART/M37P2_DIRECT_AUTHOR_NATIVE_EDITOR_FIXED_REVIEW_V3_NOT_ART.blend \
             --actions /tmp/G4C7_PAIR_NON_ART_FIXTURE.json \
             --out /tmp/G4C7_PAIRED_NATIVE_OPERATOR_TECH_ONLY
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          d=Path('/tmp/G4C7_PAIRED_NATIVE_OPERATOR_TECH_ONLY')
          report=json.loads((d/'P2_OPERATOR_STUDY_HOLD_EVIDENCE.json').read_text())
          assert report['art']=='HOLD' and report['official_adoptions']==0
          assert report['minecraft']=='FORBIDDEN' and report['formal_331_993']=='NOT_RUN'
          assert report['action_count']==8 and report['roles']=={'city_macro':4,'habitat':4}
          n=d/report['native_file']
          assert n.is_file() and n.stat().st_size>500
          assert hashlib.sha256(n.read_bytes()).hexdigest()==report['native_sha256']
          src=Path('artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART/M37P2_DIRECT_AUTHOR_NATIVE_EDITOR_FIXED_REVIEW_V3_NOT_ART.blend')
          assert hashlib.sha256(src.read_bytes()).hexdigest()==report['original_sha256']
          print('NATIVE_EDIT_OPERATOR_PAIRED_MACRO_HABITAT_TECH_ONLY_ART_HOLD_PASS')
          PY
          test -z "$(git status --porcelain -- artifacts/g4c7-m37p2-patched-native-author-editor-v3-NOT-ART)"
      - name: Capture exactly three true Cycles evidence PNGs from the SAME saved non-art native file
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 360s python -u tools/g4c7_m37p2_paired_operator_three_view_evidence.py \
             --source /tmp/G4C7_PAIRED_NATIVE_OPERATOR_TECH_ONLY/P2_NATIVE_EDITOR_PAIRED_STUDY_UNAPPROVED.blend \
             --out /tmp/G4C7_PAIRED_THREE_REAL_VIEWS_NON_ART
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/G4C7_PAIRED_THREE_REAL_VIEWS_NON_ART')
          r=json.loads((p/'P2_NATIVE_PAIRED_THREE_VIEW_REPORT.json').read_text())
          assert r['art']=='HOLD' and r['official_adoptions']==0
          assert r['true_city'] is False and r['human_gui_authorship']=='NOT_PERFORMED'
          assert r['camera_positions_author_approved'] is False
          assert set(r['views'])=={'AERIAL','PUBLIC_EYE','HABITAT_EYE'}
          for name,im in r['views'].items():
              raw=(p/im['filename']).read_bytes()
              assert raw[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert hashlib.sha256(raw).hexdigest()==im['sha256'],name
          original=Path('/tmp/G4C7_PAIRED_NATIVE_OPERATOR_TECH_ONLY/P2_NATIVE_EDITOR_PAIRED_STUDY_UNAPPROVED.blend')
          assert hashlib.sha256(original.read_bytes()).hexdigest()==r['original_stored_blend_sha256']
          assert (p/'OPEN_REAL_THREE_VIEW_NON_ART.html').is_file()
          print('PAIRED_NATIVE_ONE_SAVED_BLEND_THREE_REAL_CYCLES_PNG_TECH_PASS_NOT_ART')
          PY
      - name: Use all three real PNGs as ART-FIRST feedback and assert EARLY ART REJECT (never PASS)
        run: |
          set -euo pipefail
          python -u tools/g4c7_m37p2_visual_feedback_gate.py \
            --report /tmp/G4C7_PAIRED_THREE_REAL_VIEWS_NON_ART/P2_NATIVE_PAIRED_THREE_VIEW_REPORT.json \
            --out /tmp/G4C7_PAIRED_VISUAL_FEEDBACK_ONLY
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/G4C7_PAIRED_VISUAL_FEEDBACK_ONLY')
          r=json.loads((p/'P2_REAL_IMAGE_ART_FEEDBACK.json').read_text())
          assert r['outcome']=='EARLY_ART_REJECT',r
          assert 'TWO_CUBOIDS_8_VERTICES_6_FACES_EACH' in r['reasons']
          assert 'MISSING_HABITAT_LIVING_INTERIOR' in r['reasons']
          assert r['official_adoptions']==0 and r['art']=='HOLD'
          assert r['vision']['status']=='NOT_REQUESTED'
          assert len(list(p.glob('*.png')))==3
          assert (p/'OPEN_THREE_VIEW_VISUAL_FEEDBACK.html').is_file()
          print('TRUE_CYCLES_THREE_IMAGES_ART_FIRST_EARLY_REJECT_TECH_NO_ART_PASS')
          PY
          cp /tmp/G4C7_PAIRED_VISUAL_FEEDBACK_ONLY/P2_REAL_IMAGE_ART_FEEDBACK.json /tmp/G4C7_PAIRED_THREE_REAL_VIEWS_NON_ART/
          cp /tmp/G4C7_PAIRED_VISUAL_FEEDBACK_ONLY/OPEN_THREE_VIEW_VISUAL_FEEDBACK.html /tmp/G4C7_PAIRED_THREE_REAL_VIEWS_NON_ART/
      - name: Upload THREE TRUE Blender renders strictly labeled NOT ART
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4c7-p2-paired-native-true-three-views-tech-only-not-art
          path: /tmp/G4C7_PAIRED_THREE_REAL_VIEWS_NON_ART/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify truly native saved scene has both edited meshes in same Blender scene
        run: |
          python - <<'PY'
          import bpy
          p='/tmp/G4C7_PAIRED_NATIVE_OPERATOR_TECH_ONLY/P2_NATIVE_EDITOR_PAIRED_STUDY_UNAPPROVED.blend'
          bpy.ops.wm.open_mainfile(filepath=p)
          sc=bpy.context.scene
          assert sc.get('P2_SOURCE_KIND')=='LOCAL_LLM_NATIVE_EDIT_OPERATOR_TRIAL_NOT_GUI_HUMAN'
          assert sc.get('P2_ART')=='HOLD' and sc.get('P2_OFFICIAL_ADOPTIONS')==0
          for name in ('P2_CITY_MACRO_DIRECT_AUTHOR','P2_HABITAT_PRIVATE_DIRECT_AUTHOR'):
              objs=[o for o in bpy.data.collections[name].objects if o.type=='MESH']
              assert len(objs)==1,(name,objs)
              assert len(objs[0].data.polygons)>1,name
          assert sc.get('P2_MINECRAFT')=='FORBIDDEN'
          print('TRUE_SAVED_NATIVE_BLENDER_TWO_ROLES_ONE_SCENE_ART_HOLD_TECH_ONLY')
          PY
