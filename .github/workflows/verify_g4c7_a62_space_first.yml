name: A62 Space-first G0 native geometry review (NOT CITY ART PASS)
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - 'artifacts/g4c7-a62-space-first/a62_space_first.py'
      - 'artifacts/g4c7-a62-space-first/scene_plan.json'
      - '.github/workflows/verify_g4c7_a62_space_first.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g4c7-a62-g0-open-gl-evidence
  cancel-in-progress: false
jobs:
  actual-room-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VTK headless renderer and helpers
        run: |
          python -m pip install --disable-pip-version-check 'vtk==9.6.2'
      - name: Provide deterministic software OpenGL for headless VTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1-mesa-dri libegl1
      - name: Independent room contract and 5 deliberate negative controls
        run: |
          python -m py_compile artifacts/g4c7-a62-space-first/a62_space_first.py
          python artifacts/g4c7-a62-space-first/a62_space_first.py --negative
      - name: Render two genuine independent OpenGL camera views
        env:
          VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python artifacts/g4c7-a62-space-first/a62_space_first.py --build
      - name: Verify image binary integrity and no city acceptance claims
        run: |
          python - <<'PY'
          import hashlib, json,struct,zlib
          from pathlib import Path
          o=Path('artifacts/g4c7-a62-space-first/output')
          m=json.loads((o/'manifest.json').read_text())
          assert m['stage']=='A62' and m['renderer']=='VTK_OPENGL_NOT_BLENDER_CYCLES'
          assert m['city_claim'] is False and m['minecraft_construction']=='FORBIDDEN'
          assert m['G1']==m['G2']==m['G3']=='NOT_RUN'
          assert m['rooms']==3 and m['housing']==4
          for name in ('public_heart.png','oblique.png'):
              data=(o/name).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              off=8; types=[]
              while off<len(data):
                  n=struct.unpack_from('>I',data,off)[0]
                  typ=data[off+4:off+8];body=data[off+8:off+8+n]
                  crc=struct.unpack_from('>I',data,off+8+n)[0]
                  assert zlib.crc32(typ+body)&0xffffffff==crc
                  if typ==b'IHDR':assert struct.unpack('>II',body[:8])==(1200,800)
                  types.append(typ);off+=12+n
                  if typ==b'IEND':break
              assert off==len(data) and b'IDAT' in types and b'IEND' in types
              assert hashlib.sha256(data).hexdigest()==m['outputs'][name]['sha256']
          print('A62 two real OpenGL PNGs and 5 negative controls limited technical PASS; ART HOLD')
          PY
      - name: Upload authentic evidence even if later preservation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a62-g0-real-opengl-not-blender-not-art-accepted
          path: artifacts/g4c7-a62-space-first/output/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve original A62 real 3D evidence without rewriting historical assets
        run: |
          set -euo pipefail
          O=artifacts/g4c7-a62-space-first/output
          test -f "$O/public_heart.png"
          test -f "$O/oblique.png"
          test -f "$O/manifest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$O"
          git diff --cached --quiet && { echo 'New evidence missing'; exit 1; }
          git commit -m 'A62: preserve genuine space-first OpenGL images (G0 ART HOLD)'
          git push origin "HEAD:refs/heads/dev/g4c7-a17-monolithic-rift-fold-art-study"
