name: A75 shared-source inhabited geometry native dual-view G0 (ART NOT PASS)
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - 'tools/g4c7_a75_registered_native.py'
      - '.github/workflows/verify_g4c7_a75_native.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g4c7-a75-native-falsification
  cancel-in-progress: false
jobs:
  genuine-editable-section:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze historical geometry source without edits
        run: |
          test "$(git rev-parse 'HEAD:tools/g4c7_a73_topology_fabric.py')" = '3d66148a672bb37482ae0139276a57edcbcc35ef'
      - name: Install official Blender and exact Shapely dependency
        run: |
          python -m pip install --disable-pip-version-check 'shapely==2.1.2' 'bpy==4.5.15' --extra-index-url https://download.blender.org/pypi/bpy/
          python -c "import bpy; assert bpy.app.version[:2]==(4,5)"
      - name: Verify 4 real floor contacts and 9 negative cases BEFORE native model
        run: |
          python -m py_compile tools/g4c7_a75_registered_native.py
          python tools/g4c7_a75_registered_native.py --preflight --negatives
      - name: Build editable real A73 registered Blender mesh and render two true Cycles views
        run: python tools/g4c7_a75_registered_native.py --render
      - name: Reopen Blender native source and check program-registration truth
        run: |
          python - <<'PY'
          from pathlib import Path
          import bpy,json,hashlib
          d=Path('artifacts/g4c7-a75-registered-native/native-output')
          f=d/'a75_registered_civic_section.blend'
          assert f.read_bytes()[:7]==b'BLENDER'
          m=json.loads((d/'a75_manifest.json').read_text())
          assert m['stage']=='A75' and m['renderer']=='BLENDER_4_5_CYCLES'
          assert m['art']=='NOT_ASSESSED' and m['overall_art']=='HOLD'
          assert m['minecraft']==m['city_integration']=='FORBIDDEN'
          assert all(x=='NOT_RUN' for x in m['formal'].values())
          assert m['true_cameras']==2 and m['technical_metrics']['stairs']==70
          assert not m['real_walkability'] and not m['human_collision'] and not m['structure_support']
          assert m['exact_public_eye']==[0,-16,1.7]
          assert hashlib.sha256(f.read_bytes()).hexdigest()==m['blend_sha256']
          bpy.ops.wm.open_mainfile(filepath=str(f.resolve()))
          assert bpy.context.scene.render.engine=='CYCLES'
          assert sum(x.type=='CAMERA' for x in bpy.data.objects)==2
          for name,w in [('MARKET',4.0),('MAKER',4.2),('READING',4.6),('HOUSING',4.0)]:
            assert abs(m['technical_metrics']['rooms'][name]['open_width']-w)<1e-8
            assert abs(m['technical_metrics']['rooms'][name]['contact']-w)<1e-8
            assert any(o.name.startswith(name+'_INTERIOR_3D_FLOOR') for o in bpy.data.objects)
            assert bpy.data.objects.get(name+'_BEAM_ABOVE_ACTUAL_OPENING')
            assert bpy.data.objects.get(name+'_ACTUAL_FRONT_WALL_0')
            assert bpy.data.objects.get(name+'_ACTUAL_FRONT_WALL_1')
          assert sum('_REAL_TREAD_' in x.name for x in bpy.data.objects)==70
          for name in ('public_eye','oblique'):
            raw=(d/(name+'.png')).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==m['views'][name]['sha256']
            assert raw[:8]==bytes.fromhex('89504e470d0a1a0a')
          print('A75_TRUE_REGISTERED_BLENDER_DUAL_CYCLES_TECH_PASS_ONLY_ART_UNASSESSED')
          PY
      - name: Upload true .blend and 2 PNG diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a75-registered-native-G0-art-evidence-not-approved
          path: artifacts/g4c7-a75-registered-native/native-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Append-only save new native evidence, never historical artifacts
        run: |
          set -euo pipefail
          D=artifacts/g4c7-a75-registered-native/native-output
          test -s "$D/a75_registered_civic_section.blend"
          test -s "$D/public_eye.png"
          test -s "$D/oblique.png"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$D"
          git diff --cached --quiet && { echo 'No newly generated evidence'; exit 1; }
          git commit -m 'A75: preserve actual registered room/corridor Blender scene and two Cycles views G0'
          git push origin HEAD:refs/heads/dev/g4c7-a17-monolithic-rift-fold-art-study
