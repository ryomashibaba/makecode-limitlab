name: G4-C7 A83-B8 source-volume intersection counterexample
on:
  push:
    branches: [dev/g4c7-a17-monolithic-rift-fold-art-study]
    paths:
      - 'artifacts/g4c7-a83-b8-inhabited-contact/b8_source.py'
      - 'artifacts/g4c7-a83-b8-inhabited-contact/test_b8.py'
      - '.github/workflows/g4c7_a83_b8_source_only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source geometry kernel only
        run: python -m pip install 'shapely==2.1.2'
      - name: Verify source volume intersections and destructive controls
        run: |
          cd 'artifacts/g4c7-a83-b8-inhabited-contact'
          python -m unittest test_b8 -v
          python b8_source.py
      - name: Reject any claim of construction or art approval
        run: |
          cd 'artifacts/g4c7-a83-b8-inhabited-contact'
          python - <<'PY'
          from b8_source import audit
          a=audit()
          assert a['source_geometry_constraints_satisfied']
          assert a['actual_shared_walking_air']=='NOT_TESTED'
          assert a['pre3d_art'].startswith('REJECT')
          assert a['art_adoptions']==0
          assert a['minecraft_construction']=='FORBIDDEN'
          print('A83_B8_SOURCE_G0_ONLY / PRE3D_REJECT / NO_CONSTRUCTION')
          PY
