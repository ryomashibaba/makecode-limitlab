name: G4-C7 B11-R5 D15 pre-3D author rejection (NO ADOPTION)
on:
  push:
    branches:
      - dev/g4c7-a17-monolithic-rift-fold-art-study
    paths:
      - 'research/g4c7-b11-r5-d15/**'
      - '.github/workflows/g4c7-b11-r5-d15-pre3d.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4c7-d15-negative-pre3d
  cancel-in-progress: true
jobs:
  preflight-reject-bad-designs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometric section dependency
        run: python -m pip install 'shapely>=2.0'
      - name: Recompute all three 2D author section negative gates
        working-directory: research/g4c7-b11-r5-d15
        run: python d15_preart_gate.py
      - name: Assert safe rejection and no silent art/QA promotion
        working-directory: research/g4c7-b11-r5-d15
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('d15_preart_results.json').read_text())
          assert d['status']=='ALL_3_PRE3D_REJECT' and d['self_test']=='PASS'
          assert len(d['candidates'])==3
          assert [x['unconnected_to_ground_section_components'] for x in d['candidates']]==[3,5,1]
          assert all(x['art']=='NOT_ADOPTED' and x['real_3d']=='NOT_RUN' and x['Minecraft']=='FORBIDDEN' for x in d['candidates'])
          print('PASS means early rejection reliability, never G0 ART PASS or 3D construction.')
          PY
      - name: Archive exact negative test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4c7-d15-2d-preart-rejection-not-3d
          retention-days: 14
          path: research/g4c7-b11-r5-d15/d15_preart_results.json
